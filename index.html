<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nuolaidos ir Pasiūlymai</title>
  <link rel="stylesheet" href="style.css">

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  </script>
</head>

<body>

  <h1>Nuolaidos ir pasiūlymai BLS darbuotojams</h1>

  <!-- GRIDAS -->
  <div id="grid" class="grid"></div>

  <!-- MULTI-PAGE PDFs -->
  <div id="carouselContainer"></div>

  <!-- DRAUDIMAS PDFs -->
  <h1>Sveikatos draudimas</h1>
  <div id="carouselContainerDraudimas"></div>

  <!-- Fullscreen PDF viewer -->
  <div id="overlay" class="overlay">
    <div class="overlay-box">
      <button class="close-btn" id="closeBtn">Close</button>
      <div class="nav-arrow nav-arrow-left" id="prevPageBtn">&#10094;</div>
      <div class="nav-arrow nav-arrow-right" id="nextPageBtn">&#10095;</div>
      <canvas id="pdfCanvas"></canvas>
    </div>
  </div>

<script>
/* ========= CONFIG ========= */
const isMobile = window.innerWidth < 768;
const THUMB_SCALE = isMobile ? 0.22 : 0.35;
const PLACEHOLDER =
  "data:image/svg+xml;charset=UTF-8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='280'><rect width='100%' height='100%' fill='%23eee'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23999' font-size='14'>Loading…</text></svg>";

/* ========= FILE LISTS ========= */
const multiPagePdfs = [
  "PDF`s/Antėja.pdf",
  "PDF`s/GYM HUB pasiūlymas.pdf"
];

const draudimasPdfs = [
  "PDF`s/Sveikatos draudimo atmintinė.pdf",
  "PDF`s/Draudimo varianto pasirinkimas.pdf"
];

const singlePagePdfs = [
  "PDF`s/Altadenta.pdf",
  "PDF`s/Vero cafe.pdf",
  "PDF`s/Kvepalų sala.pdf",
  "PDF`s/Sportuok.lt.pdf",
  "PDF`s/Unipark.pdf",
  "PDF`s/KlipShop.pdf",
  "PDF`s/Optometrijos centras.pdf",
  "PDF`s/AirGuru.pdf",
  "PDF`s/Švaros broliai.pdf",
  "PDF`s/Coveris.pdf",
  "PDF`s/L'occitane.pdf",
  "PDF`s/Žieminis langų ploviklis.pdf",
  "PDF`s/Dovanų sala.pdf",
  "PDF`s/Vytautas Mineral SPA.pdf",
  "PDF`s/Makalius.lt.pdf",
  "PDF`s/Fielman.pdf",
  "PDF`s/Hopcover.pdf",
  "PDF`s/Greitasis testas.pdf",
  "PDF`s/Officeday.pdf",
  "PDF`s/Army shop.pdf",
  "PDF`s/Bricks4kidz.pdf",
  "PDF`s/Šypsenos akademija.pdf",
  "PDF`s/Knygos.lt.pdf",
  "PDF`s/Rezus.pdf",
  "PDF`s/Intellectus.pdf",
  "PDF`s/Girstučio baseinas.pdf",
  "PDF`s/Nr1 Pica.pdf",
  "PDF`s/Autoaibė.pdf",
  "PDF`s/CurioCity.pdf",
  "PDF`s/Alkava.pdf",
  "PDF`s/Hello Park.pdf",
  "PDF`s/Circkle K.pdf"
  
];

/* ========= DOM ========= */
const carouselContainer = document.getElementById("carouselContainer");
const carouselContainerDraudimas = document.getElementById("carouselContainerDraudimas");
const grid = document.getElementById("grid");
const overlay = document.getElementById("overlay");
const pdfCanvas = document.getElementById("pdfCanvas");
const closeBtn = document.getElementById("closeBtn");
const prevPageBtn = document.getElementById("prevPageBtn");
const nextPageBtn = document.getElementById("nextPageBtn");

/* ========= STATE ========= */
let currentPdfDoc = null;
let currentPage = 1;
let totalPages = 1;
const pdfCache = new Map();

/* ========= UTILS ========= */
function niceName(pdfPath) {
  return pdfPath.split("/").pop().replace(/\.pdf$/i, "");
}

/* ========= PDF ========= */
async function getPdfDoc(pdfPath) {
  if (pdfCache.has(pdfPath)) return pdfCache.get(pdfPath);
  const pdf = await pdfjsLib.getDocument(encodeURI(pdfPath)).promise;
  pdfCache.set(pdfPath, pdf);
  return pdf;
}

async function generateThumbnail(pdfPath, pageNumber, img) {
  const pdf = await getPdfDoc(pdfPath);
  const page = await pdf.getPage(pageNumber);
  const viewport = page.getViewport({ scale: THUMB_SCALE });
  const canvas = document.createElement("canvas");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
  img.src = canvas.toDataURL();
}

/* ========= LAZY LOAD ========= */
function observeThumbnail(card, pdfPath, pageNumber) {
  const img = card.querySelector("img");

  const observer = new IntersectionObserver(async ([entry]) => {
    if (!entry.isIntersecting) return;
    observer.disconnect();
    generateThumbnail(pdfPath, pageNumber, img);
  }, { rootMargin: "150px" });

  observer.observe(card);
}

/* ========= CARDS ========= */
function createCard(pdfPath, pageNumber, labelText, isCarousel) {
  const card = document.createElement("div");
  card.className = isCarousel ? "carousel-item" : "grid-item";

  const img = document.createElement("img");
  img.src = PLACEHOLDER;

  const thumb = document.createElement("div");
  thumb.className = "thumb";
  thumb.appendChild(img);

  const title = document.createElement("div");
  title.className = "title";
  title.textContent = labelText;

  card.appendChild(thumb);
  card.appendChild(title);
  card.onclick = () => openPDF(pdfPath, pageNumber);

  observeThumbnail(card, pdfPath, pageNumber);
  return card;
}

/* ========= FULLSCREEN ========= */
async function renderCurrentPage() {
  const page = await currentPdfDoc.getPage(currentPage);
  const viewport = page.getViewport({ scale: 1 });

  const fit = Math.min(
    window.innerWidth * 0.95 / viewport.width,
    window.innerHeight * 0.95 / viewport.height
  );

  const scale = fit * (window.devicePixelRatio || 1);
  const renderViewport = page.getViewport({ scale });

  pdfCanvas.width = renderViewport.width;
  pdfCanvas.height = renderViewport.height;
  pdfCanvas.style.width = viewport.width * fit + "px";
  pdfCanvas.style.height = viewport.height * fit + "px";

  await page.render({
    canvasContext: pdfCanvas.getContext("2d"),
    viewport: renderViewport
  }).promise;

  prevPageBtn.style.display = currentPage > 1 ? "flex" : "none";
  nextPageBtn.style.display = currentPage < totalPages ? "flex" : "none";
}

async function openPDF(pdfPath, pageNumber) {
  overlay.style.display = "flex";
  requestAnimationFrame(() => overlay.classList.add("active"));

  currentPdfDoc = await getPdfDoc(pdfPath);
  totalPages = currentPdfDoc.numPages;
  currentPage = pageNumber || 1;
  renderCurrentPage();
}

/* ========= RENDER ========= */
function renderCarousel(container, list) {
  list.forEach(async pdfPath => {
    const pdf = await getPdfDoc(pdfPath);
    const block = document.createElement("div");
    const title = document.createElement("div");
    title.className = "pdf-block-title";
    title.textContent = niceName(pdfPath);

    const wrapper = document.createElement("div");
    wrapper.className = "carousel-wrapper";

    block.append(title, wrapper);
    container.appendChild(block);

    for (let p = 1; p <= pdf.numPages; p++) {
      wrapper.appendChild(createCard(pdfPath, p, "", true));
    }
  });
}

renderCarousel(carouselContainer, multiPagePdfs);
renderCarousel(carouselContainerDraudimas, draudimasPdfs);

singlePagePdfs.forEach(pdf =>
  grid.appendChild(createCard(pdf, 1, niceName(pdf), false))
);

/* ========= CONTROLS ========= */
closeBtn.onclick = () => {
  overlay.classList.remove("active");
  setTimeout(() => overlay.style.display = "none", 300);
};
prevPageBtn.onclick = e => { e.stopPropagation(); if (currentPage > 1) { currentPage--; renderCurrentPage(); }};
nextPageBtn.onclick = e => { e.stopPropagation(); if (currentPage < totalPages) { currentPage++; renderCurrentPage(); }};
overlay.onclick = e => e.target === overlay && closeBtn.onclick();
</script>

</body>
</html>
